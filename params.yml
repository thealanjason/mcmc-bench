

model: 
  name: "IA_voellmy"
  file: "surrogate_voellmy.pkl"
  input_dim: [2]
  output_dim: [1]
  debug: false
  max_workers: 1 # We need it to be 1 because rpy2 is not thread safe


calibration:
  sampler: dynesty # emcee, dynesty, rwmcmc, pymc_slice, pymc_smc
  sampler_params:
    rwmcmc:
        step_size: [0.15, 1200] # step size for each parameter, mu and xi, respectively. I took 10% of the range. This should be modified/tuned according to the acceptance ratio from the real test. Okay so I tested it, this gives the best results for efficiency and acceptance ratio. I will keep it for now.
        nwalkers:     4

    emcee:
      nwalkers:     8
      pool_type:    serial   # serial | thread | process
      n_workers:    1

    dynesty:
      nlive:        3000     # number of live points; more = more accurate evidence, slower
      dlogz:        0.1    # stopping criterion: stop when remaining ln(Z) contribution < this
      nprocs:       1        # number of processes to use for parallelization

    pymc_slice:
      chains:        4
      cores:        1
      tune:       1000  # burn-in draws 
      draws:       4000 # successful draws (tune + draws = total draws)
      random_seed: 42

    pymc_smc:
      draws: 2000 # number of draws per chain (success)
      chains: 4
      cores: 1
      threshold: 0.5
      correlation_threshold: 0.01
      random_seed: 42

  nburn:        1000
  nsteps:       5000
  parameters: ["mu", "xi"] 
  noise_parameters: ["sigma"]
  calibrate_noise: false
  noise_sigma: 0.05
  data: ["ImpactArea"]
  likelihood: normal
  priors:
    - name: mu
      distribution:
        type: uniform     
        attribute:
          lower_bound: 2.e-02
          upper_bound: 5.e-01
    - name: xi
      distribution:
        type: uniform     
        attribute:
          lower_bound: 4.e+02 
          upper_bound: 4.e+03
    - name: sigma
      distribution:
        type: uniform     
        attribute:
          lower_bound: 1.0e-9
          upper_bound: 0.5
